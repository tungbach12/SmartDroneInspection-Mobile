<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartDroneInspection Customer Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SDI Customer Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SDI Customer Portal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f8fafc;
    }
    #sdi-web-splash {
      --sdi-bg: #f8fafc;
      --sdi-card: rgba(255, 255, 255, 0.94);
      --sdi-border: rgba(148, 163, 184, 0.24);
      --sdi-text: #0f172a;
      --sdi-muted: #2563eb;
      --sdi-track: rgba(59, 130, 246, 0.14);
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(59, 130, 246, 0.11), transparent 52%),
        radial-gradient(circle at 52% 56%, rgba(45, 212, 191, 0.09), transparent 46%),
        var(--sdi-bg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--sdi-text);
      transition: opacity 0.24s ease-out;
    }
    #sdi-web-splash.sdi-dark {
      --sdi-bg: #0b1120;
      --sdi-card: rgba(15, 23, 42, 0.94);
      --sdi-border: rgba(148, 163, 184, 0.18);
      --sdi-text: #f8fafc;
      --sdi-muted: #60a5fa;
      --sdi-track: rgba(59, 130, 246, 0.22);
    }
    #sdi-web-splash.sdi-leaving {
      opacity: 0;
      pointer-events: none;
    }
    .sdi-splash-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .sdi-iris-stage {
      position: relative;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
    }
    .sdi-iris-halo {
      position: absolute;
      inset: -10px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.24) 0%, rgba(45, 212, 191, 0.12) 48%, transparent 72%);
      animation: sdi-pulse 2.4s ease-in-out infinite;
    }
    .sdi-iris-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      padding: 3px;
      background: conic-gradient(from 0deg, #3b82f6 0deg, #0ea5e9 95deg, #2dd4bf 190deg, rgba(59, 130, 246, 0.08) 280deg, transparent 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: sdi-spin 1.45s cubic-bezier(0.45, 0.15, 0.55, 0.85) infinite;
    }
    .sdi-iris-core {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: var(--sdi-card);
      border: 1px solid var(--sdi-border);
      box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.18);
      display: grid;
      place-items: center;
    }
    .sdi-iris-svg {
      width: 44px;
      height: 44px;
      animation: sdi-breathe 2.4s ease-in-out infinite;
    }
    .sdi-splash-brand {
      text-align: center;
    }
    .sdi-splash-brand strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sdi-splash-brand span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      color: var(--sdi-muted);
    }
    .sdi-splash-bar {
      width: 136px;
      height: 3px;
      border-radius: 999px;
      background: var(--sdi-track);
      overflow: hidden;
      position: relative;
    }
    .sdi-splash-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 46%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b82f6, #0ea5e9, #2dd4bf);
      animation: sdi-sweep 1.5s ease-in-out infinite;
    }
    @keyframes sdi-spin { to { transform: rotate(360deg); } }
    @keyframes sdi-pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.72; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes sdi-breathe {
      0%, 100% { transform: rotate(0deg) scale(0.96); }
      50% { transform: rotate(12deg) scale(1.04); }
    }
    @keyframes sdi-sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(230%); }
    }
  </style>
</head>
<body>
  <div id="sdi-web-splash" aria-hidden="true">
    <div class="sdi-splash-stack">
      <div class="sdi-iris-stage">
        <div class="sdi-iris-halo"></div>
        <div class="sdi-iris-ring"></div>
        <div class="sdi-iris-core">
          <svg class="sdi-iris-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sdi_fl_iris" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3B82F6"/>
                <stop offset="1" stop-color="#2DD4BF"/>
              </linearGradient>
            </defs>
            <path d="M9.97 12.72A18 18 0 0 1 33.6 8.78L29.88 18A8.4 8.4 0 0 0 19.83 16.71Z" fill="#3B82F6"/>
            <path d="M35.28 9.97A18 18 0 0 1 39.22 33.6L30 29.88A8.4 8.4 0 0 0 31.29 19.83Z" fill="#0EA5E9"/>
            <path d="M38.03 35.28A18 18 0 0 1 14.4 39.22L18.12 30A8.4 8.4 0 0 0 28.17 31.29Z" fill="url(#sdi_fl_iris)"/>
            <path d="M12.72 38.03A18 18 0 0 1 8.78 14.4L18 18.12A8.4 8.4 0 0 0 16.71 28.17Z" fill="#2B84EB"/>
            <circle cx="24" cy="24" r="5.6" fill="url(#sdi_fl_iris)"/>
            <circle cx="24" cy="24" r="2.4" fill="#FFFFFF"/>
          </svg>
        </div>
      </div>
      <div class="sdi-splash-brand">
        <strong>SDI</strong>
        <span>Customer Portal</span>
      </div>
      <div class="sdi-splash-bar"></div>
    </div>
  </div>
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('flutter.app_theme_mode');
        if (mode === '"dark"' || mode === 'dark') {
          document.getElementById('sdi-web-splash')?.classList.add('sdi-dark');
        }
      } catch (e) {}

      var dismissed = false;
      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('sdi-web-splash');
        if (!el) return;
        el.classList.add('sdi-leaving');
        setTimeout(function () { el.remove(); }, 260);
      }

      window.addEventListener('flutter-first-frame', dismissSplash, { once: true });
      document.addEventListener('flutter-first-frame', dismissSplash, { once: true });

      function hasFlutterSurface() {
        return Boolean(
          document.querySelector('flutter-view, flt-glass-pane, flt-semantics-placeholder')
        );
      }

      if (hasFlutterSurface()) {
        requestAnimationFrame(dismissSplash);
      } else {
        var observer = new MutationObserver(function () {
          if (hasFlutterSurface()) {
            observer.disconnect();
            requestAnimationFrame(dismissSplash);
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
